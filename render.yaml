services:
  - type: web
    name: campus-command-center
    runtime: node
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_PATH
        value: /var/data/campus-command-center.sqlite
    disk:
      name: campus-command-center-data
      mountPath: /var/data
      sizeGB: 1
